name: Build Kerala Temple mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Check what is inside the jar
        run: |
          J=$(ls build/libs/*.jar | head -1)
          echo "JAR: $J"
          echo "class files: $(unzip -l "$J" | grep -cE '\.class$')"
          unzip -l "$J" | grep -E "mods.toml|pack.mcmeta|en_us.json|priest.png|keezhshanthi.png|IdolMeshBuilder|ModCommands"
          echo "--- mods.toml ---"
          unzip -p "$J" META-INF/mods.toml | head -15
          echo "--- pack.mcmeta ---"
          unzip -p "$J" pack.mcmeta

      - name: Keep a copy with the run
        uses: actions/upload-artifact@v4
        with:
          name: keralatemple-mod
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish as a download on the Releases page
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/*.jar \
            --target "$GITHUB_SHA" \
            --title "Kerala Temple mod (latest build)" \
            --notes "Download the .jar file below and put it in the mods folder of a Minecraft 1.20.1 Forge install."
